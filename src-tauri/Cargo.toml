[package]
name = "screen-cut"
version = "0.2.0"
description = "Ligera herramienta de capturas con OCR y captura con scroll"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.17"
base64 = "0.22"
dirs = "5"

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Media_Ocr",
  "Graphics_Imaging",
  "Storage_Streams",
  "Foundation",
  "Foundation_Collections",
  "Globalization",
  "Security_Cryptography",
  "Win32_System_SystemInformation",
]

# macOS y Linux: captura con xcap y portapapeles con arboard. En Windows se
# siguen usando GDI y Win32 directamente (más rápido y sin dependencias extra).
[target.'cfg(not(windows))'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
xcap = "0.9"
arboard = { version = "3", default-features = false, features = ["image-data"] }
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSGraphics", "NSResponder"] }
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-vision = "0.3"

# xcap 0.5+ también enlaza PipeWire (para grabar vídeo, que no usamos), cuyas
# bindings no compilan con las cabeceras de Ubuntu 22.04. La 0.4 captura igual.
[target.'cfg(target_os = "linux")'.dependencies]
xcap = "0.4"
arboard = { version = "3", default-features = false, features = ["image-data", "wayland-data-control"] }
x11rb = { version = "0.13", features = ["xtest"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
