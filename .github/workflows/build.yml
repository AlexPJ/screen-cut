name: Build

# Builds the installers for every platform on pull requests, without
# publishing anything. The bundles are kept as workflow artifacts for testing.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            args: ""

    runs-on: ${{ matrix.platform }}

    # whisper.cpp: build without -march=native so the binary also runs on CPUs
    # older than the runner's (any x86-64 with AVX2, i.e. PCs from 2013 on).
    # The AVX options are ignored on ARM.
    env:
      GGML_NATIVE: "OFF"
      GGML_AVX: "ON"
      GGML_AVX2: "ON"
      GGML_FMA: "ON"
      GGML_F16C: "ON"

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: ./.github/scripts/linux-deps.sh

      # Pure JS logic shared by the in-app viewer and the exported index.html.
      - name: Frontend tests
        if: runner.os == 'Linux'
        run: node --test tests/*.test.js

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # No tagName: tauri-action only builds. The signing key is needed because
      # the updater artifacts are part of the bundle.
      - uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          projectPath: .
          args: ${{ matrix.args }}

      # Records 3 s of a virtual X screen with the real GStreamer pipeline
      # (there is no sound server, so it also covers the video-only fallback).
      - name: Linux recording smoke test
        if: runner.os == 'Linux'
        working-directory: src-tauri
        run: |
          sudo apt-get install -y xvfb gstreamer1.0-plugins-good gstreamer1.0-plugins-ugly gstreamer1.0-libav gstreamer1.0-pulseaudio
          xvfb-run -a -s "-screen 0 1280x800x24" env SCREENCUT_OUT="$RUNNER_TEMP/probe.mp4" \
            cargo test --release probe_record_linux -- --ignored --nocapture

      - uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ runner.os }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
