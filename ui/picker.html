<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Elige qué capturar</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body { display: flex; flex-direction: column; height: 100vh; }
    .picker-head {
      display: flex; align-items: center; gap: 8px;
      padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--panel);
    }
    .tabs { display: flex; gap: 4px; background: var(--panel-2); padding: 3px; border-radius: 10px; }
    .tab {
      border: 0; background: transparent; color: var(--text-dim);
      padding: 6px 14px; border-radius: 8px; font: inherit; cursor: pointer;
    }
    .tab.active { background: var(--panel); color: var(--text); box-shadow: var(--shadow); }
    .picker-head .spacer { flex: 1; }
    .grid {
      flex: 1; overflow-y: auto; padding: 16px;
      display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 14px; align-content: start;
    }
    .card {
      display: flex; flex-direction: column; gap: 8px; text-align: left;
      background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 8px; color: var(--text); font: inherit; cursor: pointer;
    }
    .card:hover, .card:focus-visible { border-color: var(--accent); box-shadow: var(--shadow-pop); outline: none; }
    .thumb {
      aspect-ratio: 16 / 10; border-radius: 6px; background: var(--panel-2);
      display: flex; align-items: center; justify-content: center; overflow: hidden;
    }
    .thumb img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .thumb .err { color: var(--text-dim); font-size: 12px; padding: 8px; text-align: center; }
    .card-title { font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card-sub { color: var(--text-dim); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .hint { padding: 10px 16px 0; color: var(--text-dim); font-size: 13px; }
    .empty { grid-column: 1 / -1; color: var(--text-dim); text-align: center; padding: 48px 16px; line-height: 1.6; }
    .session-opts {
      display: flex; align-items: center; flex-wrap: wrap; gap: 8px 18px;
      padding: 10px 16px; border-bottom: 1px solid var(--border); font-size: 13px;
    }
    .session-opts label { display: flex; align-items: center; gap: 8px; }
    .session-opts select {
      font: inherit; color: var(--text); background: var(--panel-2);
      border: 1px solid var(--border); border-radius: 7px; padding: 4px 6px;
    }
    .model-note {
      flex-basis: 100%; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      color: var(--text-dim); line-height: 1.5;
    }
    .model-note progress { width: 160px; }
  </style>
</head>
<body>
  <div class="picker-head">
    <div class="tabs">
      <button class="tab active" data-tab="windows">Ventanas</button>
      <button class="tab" data-tab="screens">Pantallas</button>
    </div>
    <button id="btn-region" class="btn btn-small" hidden>Región…</button>
    <span class="spacer"></span>
    <button id="btn-refresh" class="btn btn-small">Actualizar</button>
    <button id="btn-cancel" class="btn btn-small">Cancelar</button>
  </div>
  <div id="session-opts" class="session-opts" hidden>
    <label>Idioma de la transcripción <select id="lang"></select></label>
    <label><input type="checkbox" id="remember" /> Recordar para próximas sesiones</label>
    <div id="model-note" class="model-note" hidden>
      <span id="model-text"></span>
      <button id="btn-download" class="btn btn-small" hidden></button>
      <progress id="model-progress" max="1" value="0" hidden></progress>
    </div>
  </div>
  <p id="hint" class="hint" hidden>Elige la ventana, la pantalla o la región que quieres fijar: durante la sesión, el atajo de captura la capturará al instante.</p>
  <div id="grid" class="grid"></div>
  <script src="languages.js"></script>
  <script src="picker.js"></script>
</body>
</html>
